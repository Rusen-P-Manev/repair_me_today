{% extends 'base.html' %}
{% block title %}Изтриване на клиент{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-5">
        <div class="card kiosk-card text-center p-5 border-danger border-2">
            <h2 class="fw-bold text-dark">Сигурни ли сте?</h2>
            <p class="fs-4 mt-3">Предстои да изтриете клиент:<br>
                <strong class="text-primary fs-3">{{ object.first_name }} {{ object.last_name }}</strong>
            </p>
            <div class="alert alert-warning fs-5">
                Това действие е необратимо и ще изтрие всички свързани данни!
            </div>
            <form method="POST" class="mt-4 d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="{% url 'garage:client_list' %}" class="btn btn-secondary kiosk-btn">Отказ</a>
                <button type="submit" class="btn btn-danger kiosk-btn fw-bold">Да, Изтрий</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
